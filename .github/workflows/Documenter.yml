name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]     # <-- esencial para que 'stable' avance
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # <-- ver historial y tags

      - name: Set up Node (for VitePress)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'              # 1.x estable

      - name: Restore Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate docs env (develop local package)
        run: |
          julia --project=docs -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=pwd()));
            Pkg.instantiate()'

      - name: Build & deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
          GKSwstype: "100"
        run: julia --project=docs docs/make.jl

name: DocumenterVitepress

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Restore Julia package cache
        id: julia-cache
        uses: julia-actions/cache@v2

      # --- 👇 Paso clave: usar el paquete local antes de instanciar ---
      - name: Install Julia dependencies (develop local)
        run: |
          julia --project=docs -e '
            using Pkg;
            Pkg.develop(path=".");
            Pkg.instantiate()'

      # --- Limpieza e instalación de dependencias npm ---
      - name: Clean and install Node.js dependencies
        run: |
          cd docs
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      # --- Construcción de la documentación con DocumenterVitepress ---
      - name: Build documentation
        run: |
          julia --project=docs -e '
            using Pkg;
            Pkg.instantiate();
            include("docs/make.jl")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100"
          JULIA_DEBUG: "Documenter"
          DATADEPS_ALWAYS_ACCEPT: true

      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
